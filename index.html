<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>BTB Pilote — Allée · Clôture · Jardin</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --all:  #cb282b;   /* Allée   — rouge charte (180C) */
  --clo:  #f1cb00;   /* Clôture — jaune charte (116C) */
  --jar:  #90c315;   /* Jardin  — vert charte  (382C) */
  /* Charte groupe Daniel Moquet (Nov. 2022) */
  --primary: #1a171b;   /* Black C */
  --red:    #cb282b;   /* 180C */
  --green:  #90c315;   /* 382C */
  --amber:  #f1cb00;   /* 116C */
  --bg:   #f4f6f9;
  --card: #ffffff;
  --text: #1a171b;
  --muted:#9aa3b0;
  --border:#e8ecf0;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; }
button { font-family: inherit; cursor: pointer; }
a { color: var(--primary); }

/* ─── Header ─── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: #fff; color: var(--text);
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow);
}
.app-logo {
  display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.02rem;
}
.app-logo img { height: 28px; width: auto; display: block; }
.app-logo .sep { opacity: .35; font-weight: 400; }
.header-actions { display: flex; align-items: center; gap: 10px; font-size: .82rem; }
.header-actions button {
  background: #f3f4f6; color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: .78rem;
}
.header-actions button:hover { background: #e9ebef; }
.header-link { color: var(--text); text-decoration: none; font-size: .78rem; border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; }
.header-link:hover { background: #f3f4f6; }

/* ─── Layout ─── */
.container { max-width: 1800px; margin: 0 auto; padding: 14px; }
.nav-tabs {
  display: flex; gap: 0; background: #fff; padding: 0 14px; border-radius: 0;
  margin-bottom: 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
  border: none; border-bottom: 1px solid var(--border); box-shadow: var(--shadow);
}
.nav-tabs button {
  flex: none; padding: 12px 14px; border: 0; border-bottom: 3px solid transparent; background: transparent;
  border-radius: 0; font-weight: 600; color: var(--muted); font-size: .88rem;
  white-space: nowrap; transition: all .15s;
}
.nav-tabs button.active { background: transparent; color: var(--text); border-bottom-color: var(--primary); }

/* ─── Cards ─── */
.card {
  background: var(--card); border-radius: 10px; padding: 14px; margin-bottom: 12px;
  border: 1px solid var(--border);
}
.card-title { font-weight: 700; margin: 0 0 10px; font-size: 1rem; display: flex; align-items: center; justify-content: space-between; }
.chip {
  display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .72rem; font-weight: 700;
  color: #fff; letter-spacing: .02em;
}
.chip-all { background: var(--all); }
.chip-clo { background: var(--clo); color: #1a171b; }
.chip-jar { background: var(--jar); }
.chip-muted { background: #e5e7eb; color: #4b5563; }

/* ─── Dashboard triple ─── */
.dash-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
@media (max-width: 720px) {
  .dash-grid { grid-template-columns: 1fr; }
}
.dash-societe {
  border-left: 5px solid var(--border); padding: 12px 14px;
  background: #fff; border-radius: 10px;
  border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.dash-societe.s-ALL { border-left-color: var(--all); }
.dash-societe.s-CLO { border-left-color: var(--clo); }
.dash-societe.s-JAR { border-left-color: var(--jar); }
.dash-societe h3 { margin: 0 0 8px; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
.dash-kpi { display: flex; justify-content: space-between; padding: 4px 0; font-size: .86rem; color: #374151; }
.dash-kpi strong { font-size: .95rem; color: var(--text); font-weight: 700; }
.dash-total {
  background: linear-gradient(135deg, #1c3b2e 0%, #2d5c46 100%); color: #fff;
  border-radius: 10px; padding: 14px; margin-top: 10px;
}
.dash-total h3 { margin: 0 0 8px; font-size: 1rem; opacity: .9; }
.dash-total-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 720px) { .dash-total-grid { grid-template-columns: repeat(2, 1fr); } }
.dash-total-kpi { background: rgba(255,255,255,.08); border-radius: 8px; padding: 10px; }
.dash-total-kpi .label { font-size: .72rem; opacity: .75; text-transform: uppercase; letter-spacing: .05em; }
.dash-total-kpi .value { font-size: 1.25rem; font-weight: 800; margin-top: 3px; }

/* ─── List items ─── */
.item-list { list-style: none; padding: 0; margin: 0; }
.item-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 6px; background: #fff;
}
.item-row:hover { background: #fafbfc; }
.item-main { flex: 1; min-width: 0; }
.item-title { font-weight: 600; word-break: break-word; }
.item-sub { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.item-actions { display: flex; gap: 4px; flex-shrink: 0; }
.btn-sm { padding: 5px 10px; font-size: .78rem; border-radius: 6px; border: 1px solid var(--border); background: #fff; }
.btn-sm:hover { background: #f3f4f6; }
.btn-sm.danger { color: var(--red); border-color: #fecaca; }
/* ─── Suivi commercial : vue par client ─── */
.suivi-list-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-items: start; }
@media (max-width: 860px) { .suivi-list-grid { grid-template-columns: 1fr; } }
.suivi-client-group {
  background: #fff; border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden; box-shadow: var(--shadow);
}
.suivi-client-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: #f9fafb; border-bottom: 1px solid var(--border);
}
.suivi-client-name { font-weight: 700; font-size: .95rem; }
.suivi-client-total { font-weight: 800; font-size: .88rem; color: var(--primary); }
.suivi-soc-block {
  border-left: 4px solid var(--border);
  margin: 8px 10px 8px 14px; border-radius: 0 7px 7px 0;
  overflow: hidden; background: #fafbfc;
}
.suivi-soc-block.s-ALL { border-left-color: var(--all); }
.suivi-soc-block.s-CLO { border-left-color: var(--clo); }
.suivi-soc-block.s-JAR { border-left-color: var(--jar); }
.suivi-soc-hd {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-bottom: 1px solid var(--border);
}
.suivi-soc-commercial { font-size: .80rem; color: var(--muted); }
.suivi-soc-total { margin-left: auto; font-weight: 700; font-size: .82rem; color: var(--text); }
.suivi-action-row {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 6px 10px; border-bottom: 1px solid #f0f0f2; font-size: .83rem;
}
.suivi-action-row:last-child { border-bottom: 0; }
.suivi-action-icon { flex: 0 0 18px; font-size: .9rem; margin-top: 2px; }
.suivi-action-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.suivi-action-top { display: flex; align-items: center; gap: 8px; }
.suivi-action-type { flex: 1; font-weight: 600; }
.suivi-action-date { flex: 0 0 78px; color: var(--muted); font-size: .77rem; }
.suivi-action-amt { flex: 0 0 82px; text-align: right; font-weight: 700; }
.suivi-action-btns { display: flex; gap: 3px; }
.suivi-action-note {
  font-size: .77rem; color: var(--muted); padding: 2px 5px; border-radius: 4px;
  min-height: 18px; outline: none; border: 1px solid transparent;
  transition: border-color .15s, background .15s; cursor: text; line-height: 1.4;
  white-space: pre-wrap; word-break: break-word;
}
.suivi-action-note:hover { border-color: var(--border); background: #f9fafb; }
.suivi-action-note:focus { border-color: #a0a0b0; background: #fff; color: var(--text); }
.suivi-action-note:empty::before { content: 'Ajouter une note…'; color: #c8c8d0; font-style: italic; pointer-events: none; }

.btn-primary {
  background: var(--primary); color: #fff; border: 0; padding: 9px 14px;
  border-radius: 7px; font-weight: 600; font-size: .88rem;
}
.btn-primary:hover { opacity: .92; }

/* ─── Form ─── */
.form-group { margin-bottom: 10px; }
.form-group label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 4px; color: #374151; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
  font-family: inherit; font-size: .9rem; background: #fff;
}
.form-group textarea { min-height: 60px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }

/* Société checkboxes */
.soc-checks { display: flex; gap: 8px; flex-wrap: wrap; }
.soc-checks label {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  border: 2px solid var(--border); border-radius: 8px; cursor: pointer;
  font-weight: 600; font-size: .85rem; transition: all .15s; user-select: none;
}
.soc-checks label.sel-ALL { border-color: var(--all); background: #fbe5e6; }
.soc-checks label.sel-CLO { border-color: var(--clo); background: #fdf4cc; }
.soc-checks label.sel-JAR { border-color: var(--jar); background: #eaf6d0; }
.soc-checks input { accent-color: var(--primary); margin: 0; }

/* ─── Commercial par société (prospect) ─── */
.pr-comm-block { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
.pr-comm-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pr-comm-radio {
  display: flex; align-items: center; gap: 5px; font-size: .82rem; cursor: pointer;
  padding: 4px 10px; border: 1.5px solid var(--border); border-radius: 6px;
  user-select: none; transition: all .12s;
}
.pr-comm-radio.sel { border-color: var(--primary); background: #f0f0f8; font-weight: 700; }
.pr-comm-radio input[type=radio] { accent-color: var(--primary); }

/* ─── Montants par société (prospect) ─── */
.pr-montants-block { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
.pr-montant-row { display: flex; align-items: center; gap: 8px; }
.pr-montant-label { flex: 0 0 76px; font-size: .79rem; font-weight: 700; padding: 3px 7px; border-radius: 5px; text-align: center; }
.pr-montant-label.l-ALL { color: var(--all); background: #fbe5e6; }
.pr-montant-label.l-CLO { color: #a07c00; background: #fdf4cc; }
.pr-montant-label.l-JAR { color: #5a8000; background: #eaf6d0; }
.pr-montant-input { flex: 1; }
.pr-montant-euro { font-size: .82rem; color: var(--muted); }
.pr-montant-total { display: flex; align-items: center; justify-content: space-between; padding-top: 7px; border-top: 2px solid var(--border); font-size: .90rem; font-weight: 700; margin-top: 2px; }

/* ─── Toast notification ─── */
.app-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--primary); color: #fff; padding: 11px 22px;
  border-radius: 9px; font-size: .88rem; font-weight: 600; z-index: 9999;
  box-shadow: 0 4px 16px rgba(0,0,0,.28); white-space: nowrap;
  animation: toast-in .2s ease;
}
@keyframes toast-in { from { opacity:0; transform:translateX(-50%) translateY(10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

/* ─── Modal ─── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
  align-items: center; justify-content: center; z-index: 200; padding: 12px;
}
.modal-bg.open { display: flex; }
.modal {
  background: #fff; border-radius: 12px; max-width: 580px; width: 100%;
  max-height: 90vh; overflow-y: auto; padding: 18px;
}
.modal h2 { margin: 0 0 12px; font-size: 1.1rem; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

/* ─── Login ─── */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #f1cb00 0%, #34943f 55%, #1a171b 100%); padding: 16px;
}
.login-card { background: #fff; border-radius: 16px; padding: 30px 26px; max-width: 380px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
.login-card h1 { margin: 0 0 4px; font-size: 1.15rem; text-align: center; }
.login-card .brand-logo { display: block; margin: 0 auto 14px; max-width: 260px; width: 100%; height: auto; }
.login-card .subtitle { text-align: center; color: var(--muted); font-size: .82rem; margin-bottom: 18px; }
.login-err { color: var(--red); font-size: .82rem; margin-top: 8px; text-align: center; }

/* ─── Planning / Gantt ─── */
.gantt-toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 10px;
}
.gantt-toolbar .mode-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.gantt-toolbar .mode-switch button {
  padding: 6px 12px; border: 0; background: #fff; font-weight: 600; font-size: .82rem; color: var(--muted);
}
.gantt-toolbar .mode-switch button.active { background: var(--primary); color: #fff; }
.gantt-toolbar .nav-btn { padding: 6px 10px; border: 1px solid var(--border); background: #fff; border-radius: 7px; font-size: .82rem; font-weight: 600; }
.gantt-toolbar .nav-btn:hover { background: #f3f4f6; }
.gantt-period { color: var(--muted); font-size: .82rem; margin-left: 4px; }

.gantt-wrap {
  overflow-x: auto; background: #fff; border: 1px solid var(--border);
  border-radius: 10px; -webkit-overflow-scrolling: touch;
}
.gantt-header-row, .gantt-row {
  display: flex; min-width: 760px; border-bottom: 1px solid #f3f4f6;
}
.gantt-header-row { background: #f9fafb; position: sticky; top: 0; z-index: 2; }
.gantt-client {
  flex: 0 0 150px; padding: 8px 10px; border-right: 1px solid var(--border);
  font-size: .85rem; font-weight: 600; color: var(--text);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  background: #fff; position: sticky; left: 0; z-index: 1;
}
.gantt-header-row .gantt-client { background: #f9fafb; font-weight: 700; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
.gantt-track { position: relative; flex: 1; min-height: 40px; background-image: linear-gradient(to right, #eef0f3 1px, transparent 1px); background-size: calc(100% / var(--cols, 8)) 100%; min-width: calc(var(--cols, 8) * 24px); }
.gantt-header-row .gantt-track { display: block; position: relative; min-height: 44px; background-image: none; min-width: calc(var(--cols, 8) * 24px); }
.gantt-header-row .gantt-cell {
  position: absolute; top: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0;
  padding: 0 2px; border-right: 1px solid #eef0f3;
  color: var(--muted); font-weight: 600; overflow: hidden;
}
.gantt-day-letter { font-size: .56rem; font-weight: 700; opacity: .6; line-height: 1.2; text-transform: uppercase; }
.gantt-day-num    { font-size: .68rem; font-weight: 600; line-height: 1.2; }
.gantt-header-row .gantt-cell.today { background: #fef3c7; color: var(--text); }
.gantt-header-row .gantt-cell.week-start { border-left: 2px solid var(--border); }
.gantt-bar {
  position: absolute; top: 4px; bottom: 4px;
  border-radius: 5px; padding: 3px 6px; font-size: .70rem; font-weight: 700;
  color: #fff; overflow: hidden;
  cursor: grab; border: 0; box-shadow: 0 1px 2px rgba(0,0,0,.12);
  display: flex; align-items: center; z-index: 1;
}
.gantt-bar:hover { filter: brightness(1.06); box-shadow: 0 2px 6px rgba(0,0,0,.18); }
.gantt-bar.dragging { opacity: .82; box-shadow: 0 6px 16px rgba(0,0,0,.28) !important; cursor: grabbing !important; z-index: 20; transition: none !important; filter: brightness(1.08); }
/* Poignées de redimensionnement */
.bar-hdl {
  position: absolute; top: 0; bottom: 0; width: 8px;
  cursor: ew-resize; z-index: 2;
  background: rgba(0,0,0,.22); opacity: 0; transition: opacity .12s;
}
.gantt-bar:hover .bar-hdl { opacity: 1; }
.bar-hdl-l { left: 0; border-radius: 5px 0 0 5px; }
.bar-hdl-r { right: 0; border-radius: 0 5px 5px 0; }
.bar-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; pointer-events: none; }
.gantt-bar.s-ALL { background: var(--all); }
.gantt-bar.s-CLO { background: var(--clo); color: #1a171b; }
.gantt-bar.s-JAR { background: var(--jar); }
.gantt-bar.done { opacity: .55; }
.gantt-bar.cancel { opacity: .4; text-decoration: line-through; }
/* Weekend overlay (mode jour) */
.gantt-we {
  position: absolute; top: 0; bottom: 0;
  background: rgba(0,0,0,.06); pointer-events: none; z-index: 0;
}
.gantt-header-row .gantt-cell.weekend { background: #ededf0; color: #b8b8c0; }
.gantt-header-row .gantt-cell.holiday { background: #fde8cc; color: #b06000; font-weight: 700; }
.gantt-holiday-band { background: rgba(255,140,0,.13) !important; }
/* Sous-lignes par enseigne */
.gantt-row-group { display: flex; min-width: 760px; border-bottom: 3px solid #c8cfd9; }
.gantt-row-group:nth-child(even) .gantt-client-group,
.gantt-row-group:nth-child(even) .gantt-subrows { background: #f7f9fc; }
.gantt-row-group:nth-child(even) .gantt-ens-tag.s-ALL { background: #f0f4f4; }
.gantt-row-group:nth-child(even) .gantt-ens-tag.s-CLO { background: #f7f5dc; }
.gantt-row-group:nth-child(even) .gantt-ens-tag.s-JAR { background: #eef8d8; }
.gantt-client-group {
  flex: 0 0 110px; padding: 0 8px;
  border-right: 1px solid var(--border);
  font-size: .80rem; font-weight: 600; color: var(--text);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  background: #fff; position: sticky; left: 0; z-index: 2;
  display: flex; align-items: center;
}
.gantt-subrows { flex: 1; display: flex; flex-direction: column; }
.gantt-subrow { display: flex; border-bottom: 1px solid #f3f4f6; }
.gantt-subrow:last-child { border-bottom: 0; }
.gantt-ens-tag {
  flex: 0 0 40px; font-size: .60rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: .03em;
  display: flex; align-items: center; justify-content: center;
  border-right: 1px solid var(--border);
  position: sticky; left: 110px; z-index: 1;
}
.gantt-ens-tag.s-ALL { color: var(--all);  background: #fff5f5; }
.gantt-ens-tag.s-CLO { color: #a07c00;     background: #fffde6; }
.gantt-ens-tag.s-JAR { color: #5a8000;     background: #f4ffe0; }
.gantt-subrow .gantt-track { min-height: 34px; }
.gantt-legend { display: flex; gap: 12px; font-size: .78rem; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.gantt-legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.gantt-legend .lg-ALL::before { background: var(--all); }
.gantt-legend .lg-CLO::before { background: var(--clo); }
.gantt-legend .lg-JAR::before { background: var(--jar); }

/* ─── Helpers ─── */
.empty { text-align: center; color: var(--muted); padding: 30px 16px; }
.flex-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: .82rem; }
.hidden { display: none !important; }
.badge-stat { background: #e5e7eb; color: #374151; padding: 2px 8px; border-radius: 10px; font-size: .72rem; font-weight: 700; margin-left: 6px; }
</style>
</head>

<body>

<!-- ═══ LOGIN ═══ -->
<div id="loginView" class="login-wrap">
  <form class="login-card" onsubmit="doLogin(event)">
    <img class="brand-logo" src="./logo-moquet.png" alt="Daniel Moquet — Le spécialiste de vos extérieurs">
    <h1>BTB Pilote</h1>

<script src="./api.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const STATE = {
  user: null,
  societes: [],
  chantiers: [],
  prospects: [],
  suivi: [],
  planning: [],
  users: [],
  planningMode: 'day',      // always day mode
  planningOffset: 0,        // décalage en semaines (0 = semaine courante)
  planningStart: null,      // Date lundi de la vue courante (pour drag)
  planningUnits: 0,         // nb de colonnes courantes (pour drag)
  hideWeekends: false,      // masquer les colonnes week-end
  ganttVisCal: null,        // visible index → calendar day offset
  ganttCalToVis: null       // calendar day offset → visible index (-1 = caché)
};

const SOC_COLORS = { ALL: '#cb282b', CLO: '#f1cb00', JAR: '#90c315' };
const SOC_LABELS = { ALL: 'Allée', CLO: 'Clôture', JAR: 'Jardin' };

// ═══════════════════════════════════════════════════════════
// Auth
// ═══════════════════════════════════════════════════════════
async function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pwd   = document.getElementById('loginPwd').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  try {
    const res = await API.login(email, pwd);
    if (!res.ok) { errEl.textContent = res.msg || 'Connexion refusée'; return; }
    STATE.user = res.user;
    localStorage.setItem('btb_user', JSON.stringify(res.user));
    await bootApp();
  } catch (err) {
    errEl.textContent = 'Erreur : ' + err.message;
  }
}
function doLogout() {
  localStorage.removeItem('btb_user');
  clearApiCache();
  STATE.user = null;
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════════
// Boot
// ═══════════════════════════════════════════════════════════
async function bootApp() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('userLabel').textContent = (STATE.user.prenom || STATE.user.email) + ' (' + (STATE.user.role || 'user') + ')';

  try {
    const data = await API.getInitialData();
    STATE.societes = data.societes || [];
    STATE.chantiers = data.chantiers || [];
    STATE.prospects = data.prospects || [];
    STATE.suivi = data.suivi || [];
    STATE.planning = data.planning || [];
    STATE.users = data.users || [];

    populateCommercialSelects();
    await loadDashboard();
    renderChantiers();
    renderProspects();
    renderSuivi();
    renderPlanning();
    badges();
  } catch (err) {
    alert('Erreur chargement : ' + err.message);
  }
}

function badges() {
  document.getElementById('badgeChantiers').textContent = STATE.chantiers.length;
  document.getElementById('badgeProspects').textContent = STATE.prospects.length;
  document.getElementById('badgeSuivi').textContent     = STATE.suivi.length;
  document.getElementById('badgePlanning').textContent  = STATE.planning.length;
}

function populateCommercialSelects() {
  var opts = ['<option value=""></option>']
    .concat(COMMERCIAUX.map(function(name) {
      return '<option value="' + esc(name) + '">' + esc(name) + '</option>';
    })).join('');
  ['chCommercial','suCommercial'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = opts;
  });
}

// ═══════════════════════════════════════════════════════════
// Navigation onglets
// ═══════════════════════════════════════════════════════════
document.getElementById('navTabs').addEventListener('click', function(e) {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  document.querySelectorAll('#navTabs button').forEach(function(x){ x.classList.remove('active'); });
  b.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(x){ x.classList.add('hidden'); });
  document.getElementById('tab-' + b.dataset.tab).classList.remove('hidden');
  if (b.dataset.tab === 'dashboard') loadDashboard();
  if (b.dataset.tab === 'planning')  renderPlanning();
});

// ═══════════════════════════════════════════════════════════
// Dashboard
// ═══════════════════════════════════════════════════════════
async function loadDashboard() {
  try {
    const stats = await API.getDashboardStats();
    const grid = document.getElementById('dashGrid');
    grid.innerHTML = stats.societes.map(function(s) {
      return '<div class="dash-societe s-' + s.code + '">' +
        '<h3><span class="chip chip-' + s.code.toLowerCase() + '">' + s.nom + '</span> <span class="muted" style="font-size:.82rem">' + s.libelle + '</span></h3>' +
        kpi('Chantiers actifs', s.chantiersActifs) +
        kpi('Prospects actifs', s.prospectsActifs) +
        kpi('CA signé du mois', fmtEuro(s.caSigneMois)) +
        kpi('CA signé année', fmtEuro(s.caSigneAnnee)) +
        kpi('CA facturé année', fmtEuro(s.caFactureAnnee)) +
        kpi('Devis envoyés mois', s.nbDevisEnvoyesMois) +
        kpi('Devis signés mois', s.nbDevisSignesMois) +
        kpi('Taux transformation', s.tauxTransformation + ' %') +
      '</div>';
    }).join('');
    const t = stats.total;
    document.getElementById('dashTotal').innerHTML =
      '<h3>Consolidé — 3 sociétés</h3>' +
      '<div class="dash-total-grid">' +
        totalKpi('Chantiers actifs', t.chantiersActifs) +
        totalKpi('Prospects actifs', t.prospectsActifs) +
        totalKpi('CA signé mois', fmtEuro(t.caSigneMois)) +
        totalKpi('CA signé année', fmtEuro(t.caSigneAnnee)) +
        totalKpi('CA facturé année', fmtEuro(t.caFactureAnnee)) +
        totalKpi('Devis envoyés mois', t.nbDevisEnvoyesMois) +
        totalKpi('Devis signés mois', t.nbDevisSignesMois) +
        totalKpi('Taux transformation', t.tauxTransformation + ' %') +
      '</div>';
    document.getElementById('dashPeriode').textContent = 'Période : ' + stats.periode;
  } catch (e) {

/* Affiche les champs montant pour les sociétés cochées + total */
function updatePrMontantFields(montants) {
  var checked = collectSocChecks('socChecksPr');
  var block = document.getElementById('prMontantsBlock');
  if (!block) return;
  if (checked.length === 0) { block.innerHTML = '<span style="color:var(--muted);font-size:.82rem">Sélectionnez d\'abord une société.</span>'; return; }
  var SOC_FR = { ALL: 'Allée', CLO: 'Clôture', JAR: 'Jardin' };
  var html = '<div class="pr-montants-block">';
  checked.forEach(function(code) {
    var val = (montants && montants[code] != null) ? montants[code] : '';
    html += '<div class="pr-montant-row">' +
      '<span class="pr-montant-label l-' + code + '">' + (SOC_FR[code] || code) + '</span>' +
      '<input class="pr-montant-input" type="number" step="0.01" min="0" id="prMontant_' + code + '" value="' + val + '" placeholder="0">' +
      '<span class="pr-montant-euro">€</span>' +
      '</div>';
  });
  html += '<div class="pr-montant-total"><span>Total</span><span id="prMontantTotalVal">—</span></div>';
  html += '</div>';
  block.innerHTML = html;
  // Recalcul du total à chaque saisie
  function recalc() {
    var total = 0;
    checked.forEach(function(code) {
      var el = document.getElementById('prMontant_' + code);
      if (el) total += parseFloat(el.value) || 0;
    });
    var el = document.getElementById('prMontantTotalVal');
    if (el) el.textContent = fmtEuro(total);
  }
  checked.forEach(function(code) {
    var el = document.getElementById('prMontant_' + code);
    if (el) el.addEventListener('input', recalc);
  });
  recalc();
}

  try {

      var savedP = STATE.prospects.find(function(p) {
        return d.id ? p.id === d.id : (p.nom === d.nom && p.prenom === d.prenom);

// ═══════════════════════════════════════════════════════════
// Suivi commercial
// ═══════════════════════════════════════════════════════════
const TYPE_LABELS = {
  r1:           { label: 'R1',           icon: '🗓' },
  r2:           { label: 'R2',           icon: '🗓' },
  r3:           { label: 'R3',           icon: '🗓' },
  rplus:        { label: 'R+',           icon: '🗓' },
  devis_envoye: { label: 'Devis envoyé', icon: '📤' },
  perdu:        { label: 'Perdu',        icon: '❌' },
  signe:        { label: 'Signé',        icon: '✅' }
};
function renderSuivi() {
  var fs = document.getElementById('filtreSocSuivi').value;
  var ft = document.getElementById('filtreTypeSuivi').value;

  var list = STATE.suivi
    .filter(function(s) { return !fs || s.societe === fs; })
    .filter(function(s) { return !ft || s.type === ft; });

  var el = document.getElementById('listSuivi');
  if (list.length === 0) { el.innerHTML = '<div class="empty">Aucune entrée</div>'; return; }

  // Grouper par client puis par société
  var byClient = {};
  list.forEach(function(s) {
    var k = (s.client || '—').trim();
    if (!byClient[k]) byClient[k] = {};
    var soc = (s.societe || '?').toUpperCase();
    if (!byClient[k][soc]) byClient[k][soc] = [];
    byClient[k][soc].push(s);
  });

  // Trier clients par date de dernière activité (plus récente d'abord)
  var clients = Object.keys(byClient).sort(function(a, b) {
    var latest = function(name) {
      var all = [];
      Object.keys(byClient[name]).forEach(function(c) { all = all.concat(byClient[name][c]); });
      return Math.max.apply(null, all.map(function(s) { return new Date(s.date || 0).getTime(); }));
    };
    return latest(b) - latest(a);
  });

  var SOC_ORDER = ['ALL', 'CLO', 'JAR'];

  el.innerHTML = '<div class="suivi-list-grid">' + clients.map(function(clientName) {
    var socGroups = byClient[clientName];
    var activeSocs = SOC_ORDER.filter(function(c) { return socGroups[c]; });

    // Total + prospectId
    var totalClient = 0;
    var prospectId = '';
    activeSocs.forEach(function(code) {
      socGroups[code].forEach(function(a) {
        totalClient += Number(a.montant) || 0;
        if (!prospectId && a.prospectId) prospectId = a.prospectId;
      });
    });

    // Bouton conversion chantier (si prospect lié)
    var convBtn = '';
    if (prospectId) {
      convBtn = '<button class="btn-sm" data-act="conv-su" data-id="' + esc(prospectId) + '" title="Créer chantier" style="margin-left:6px">🏗️</button>';
    }

    // Blocs par société
    var socHtml = activeSocs.map(function(code) {
      var actions = socGroups[code].slice().sort(function(a, b) {
        return new Date(a.date || 0) - new Date(b.date || 0);
      });
      // Commercial de la dernière action
      var commercial = '';
      actions.forEach(function(a) { if (a.commercial) commercial = a.commercial; });

      var totalSoc = actions.reduce(function(sum, a) { return sum + (Number(a.montant) || 0); }, 0);

      var actionsHtml = actions.map(function(a) {
        var t = TYPE_LABELS[a.type] || { label: a.type || '?', icon: '·' };
        return '<div class="suivi-action-row">' +
          '<span class="suivi-action-icon">' + t.icon + '</span>' +
          '<div class="suivi-action-body">' +
            '<div class="suivi-action-top">' +
              '<span class="suivi-action-type">' + esc(t.label) + '</span>' +
              '<span class="suivi-action-date">' + fmtDate(a.date) + '</span>' +
              '<span class="suivi-action-amt">' + fmtEuro(a.montant) + '</span>' +
              '<div class="suivi-action-btns">' +
                '<button class="btn-sm" data-act="edit-su" data-id="' + esc(a.id) + '">✏</button>' +
                '<button class="btn-sm danger" data-act="del-su" data-id="' + esc(a.id) + '">🗑</button>' +
              '</div>' +
            '</div>' +
            '<div class="suivi-action-note" contenteditable="true" data-note-id="' + esc(a.id) + '">' + esc(a.notes || '') + '</div>' +
          '</div>' +
          '</div>';
      }).join('');

      return '<div class="suivi-soc-block s-' + code + '">' +
        '<div class="suivi-soc-hd">' +
          '<span class="chip chip-' + code.toLowerCase() + '">' + (SOC_LABELS[code] || code) + '</span>' +
          (commercial ? '<span class="suivi-soc-commercial">' + esc(commercial) + '</span>' : '') +
          '<span class="suivi-soc-total">' + fmtEuro(totalSoc) + '</span>' +
        '</div>' +
        actionsHtml +
        '</div>';
    }).join('');

    return '<div class="suivi-client-group">' +
      '<div class="suivi-client-hd">' +
        '<span class="suivi-client-name">' + esc(clientName) + '</span>' +
        '<span style="display:flex;align-items:center">' +
          '<span class="suivi-client-total">' + fmtEuro(totalClient) + '</span>' +
          convBtn +
        '</span>' +
      '</div>' +
      '<div style="padding:8px 10px 8px 0">' + socHtml + '</div>' +
      '</div>';
  }).join('') + '</div>';
}

// ═══════════════════════════════════════════════════════════
// Planning (Gantt commun Allée / Clôture / Jardin)
// ═══════════════════════════════════════════════════════════
const PLANNING_WEEKS = 8;

function mondayOf(d) {
  const m = new Date(d);
  m.setHours(0, 0, 0, 0);
  const day = m.getDay() || 7;          // dimanche → 7
  m.setDate(m.getDate() - (day - 1));
  return m;
}
function isoWeekNum(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = x.getUTCDay() || 7;
  x.setUTCDate(x.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return Math.ceil((((x - y0) / 86400000) + 1) / 7);
}
function diffDays(a, b) {
  return Math.floor((b - a) / 86400000);
}

// ─── Jours fériés France ────────────────────────────────────────────────────

let HOLIDAYS = new Set(); // YYYY-MM-DD des jours fériés de la vue courante

/* Algorithme de Butcher : date de Pâques pour une année donnée */
function easterDate(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day   = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}

/* Construit le Set des jours fériés pour toutes les années dans la plage */
function buildHolidays(startDate, endDate) {
  const years = new Set();
  const cur = new Date(startDate);
  while (cur <= endDate) { years.add(cur.getFullYear()); cur.setDate(cur.getDate() + 1); }
  const h = new Set();
  function add(d) { h.add(localDateStr(d)); }
  years.forEach(function(y) {
    const e = easterDate(y);
    // Fériés fixes
    add(new Date(y, 0, 1));  // 1 jan
    add(new Date(y, 4, 1));  // 1 mai
    add(new Date(y, 4, 8));  // 8 mai
    add(new Date(y, 6, 14)); // 14 jul
    add(new Date(y, 7, 15)); // 15 aou
    add(new Date(y, 10, 1)); // 1 nov
    add(new Date(y, 10, 11));// 11 nov
    add(new Date(y, 11, 25));// 25 dec
    // Fériés mobiles (base Pâques)
    [1, 39, 49, 50].forEach(function(offset) {
      const hd = new Date(e); hd.setDate(hd.getDate() + offset); add(hd);
    }); // Lundi Pâques / Ascension / Pentecôte / Lundi Pentecôte
  });
  return h;
}

/* Vrai si l'unité (en mode jour) est un WE ou férié */
function isDayBlocked(unitIndex) {
  const calIdx = (STATE.ganttVisCal && STATE.ganttVisCal[unitIndex] !== undefined)
    ? STATE.ganttVisCal[unitIndex] : unitIndex;
  const d = new Date(STATE.planningStart);
  d.setDate(d.getDate() + calIdx);
  const dw = d.getDay();
  if (!STATE.hideWeekends) return dw === 0 || dw === 6 || HOLIDAYS.has(localDateStr(d));
  return HOLIDAYS.has(localDateStr(d)); // week-ends déjà absents des index visibles
}

/* Cherche le jour ouvrable le plus proche (dir = +1 droite, -1 gauche) */
function nearestWorkday(u, dir) {
  const lim = dir > 0 ? STATE.planningUnits : -1;
  while (u !== lim && isDayBlocked(u)) u += dir;
  return u;
}

// ─────────────────────────────────────────────────────────────────────────────

function renderPlanning() {
  // Toujours mode Jour : départ = aujourd'hui
  const startMonday = new Date(); startMonday.setHours(0, 0, 0, 0);
  startMonday.setDate(startMonday.getDate() + STATE.planningOffset * 7);

  const nbDays  = PLANNING_WEEKS * 7;          // 8 semaines = 56 jours
  const endDate = new Date(startMonday); endDate.setDate(endDate.getDate() + nbDays - 1);
  STATE.planningStart = new Date(startMonday);
  HOLIDAYS = buildHolidays(startMonday, endDate);

  // Mapping jours calendaires ↔ colonnes visibles
  const hideWeekends = !!(document.getElementById('ganttHideWeekends') && document.getElementById('ganttHideWeekends').checked);
  STATE.hideWeekends = hideWeekends;
  const visCal   = [];  // visible index → calendar day offset
  const calToVis = [];  // calendar day offset → visible index (-1 = caché)
  for (let i = 0; i < nbDays; i++) {
    const d0 = new Date(startMonday); d0.setDate(d0.getDate() + i);
    const dw0 = d0.getDay();
    if (!hideWeekends || (dw0 !== 0 && dw0 !== 6)) {
      calToVis[i] = visCal.length;
      visCal.push(i);
    } else {
      calToVis[i] = -1;
    }
  }
  const units = visCal.length;
  STATE.planningUnits = units;
  STATE.ganttVisCal   = visCal;
  STATE.ganttCalToVis = calToVis;

  document.getElementById('planningPeriode').textContent =
    'Du ' + fmtDate(startMonday) + ' au ' + fmtDate(endDate) +
    ' · ' + PLANNING_WEEKS + ' semaines';

  // Header + calcul des overlays weekend
  const today = new Date(); today.setHours(0,0,0,0);
  const DAY_LETTERS = ['D','L','M','M','J','V','S'];
  let header = '';
  let weekendOverlay = '';

  for (let i = 0; i < nbDays; i++) {
    const d = new Date(startMonday); d.setDate(d.getDate() + i);
    const dw = d.getDay();
    const isMon   = dw === 1;
    const isToday = d.getTime() === today.getTime();
    const isWe    = dw === 0 || dw === 6;
    const visIdx  = calToVis[i];
    // Sauter les week-ends dans l'en-tête si masqués
    if (hideWeekends && isWe) continue;
    const isHoliday = !isWe && HOLIDAYS.has(localDateStr(d));
    const cellLeft  = (visIdx / units * 100).toFixed(3);
    const cellWidth = (1 / units * 100).toFixed(3);
    header += '<div class="gantt-cell' +
      (isMon && i > 0 ? ' week-start' : '') +
      (isToday   ? ' today'   : '') +
      (isWe      ? ' weekend' : '') +
      (isHoliday ? ' holiday' : '') +
      '" style="left:' + cellLeft + '%;width:' + cellWidth + '%">' +
      '<span class="gantt-day-letter">' + DAY_LETTERS[dw] + '</span>' +
      '<span class="gantt-day-num">' + d.getDate() + '/' + (d.getMonth() + 1) + '</span>' +
      '</div>';
    // Samedi → bande de 2 jours (WE) — omise si week-ends masqués
    if (!hideWeekends && dw === 6) {
      const span  = Math.min(2, nbDays - i);
      const left  = (visIdx / units * 100).toFixed(3);
      const width = (span   / units * 100).toFixed(3);
      weekendOverlay += '<div class="gantt-we" style="left:' + left + '%;width:' + width + '%"></div>';
    }
    // Férié (hors WE) → bande individuelle
    if (isHoliday) {
      const left  = (visIdx / units * 100).toFixed(3);
      const width = (1      / units * 100).toFixed(3);
      weekendOverlay += '<div class="gantt-we gantt-holiday-band" style="left:' + left + '%;width:' + width + '%"></div>';
    }
  }

  document.getElementById('ganttHeader').innerHTML =
    '<div class="gantt-client">Client</div>' +
    '<div class="gantt-track" style="--cols:' + units + '">' + header + '</div>';

  // Regroupement par client puis par enseigne
  const byClient = {};
  (STATE.planning || []).forEach(function(p) {
    const k = (p.client || '').trim();
    if (!k) return;
    (byClient[k] = byClient[k] || []).push(p);
  });
  const clientNames = Object.keys(byClient).sort(function(a, b) {
    var minDate = function(name) {
      var dates = byClient[name].filter(function(p) { return p.dateDebut; }).map(function(p) { return new Date(p.dateDebut).getTime(); });
      return dates.length ? Math.min.apply(null, dates) : Infinity;
    };
    return minDate(a) - minDate(b);
  });

  // Helper : barre HTML pour une intervention
  function barHtml(p) {
    if (!p.dateDebut) return '';
    const deb = new Date(p.dateDebut);
    const fin = new Date(p.dateFin || p.dateDebut);
    deb.setHours(0,0,0,0); fin.setHours(0,0,0,0);
    const startUnit = diffDays(startMonday, deb);
    const endUnit   = diffDays(startMonday, fin);
    if (endUnit < 0 || startUnit >= nbDays) return '';
    const s_cal = Math.max(0, startUnit);
    const e_cal = Math.min(nbDays - 1, endUnit);
    // Convertir en index visibles (sauter les WE masqués)
    let sv = calToVis[s_cal];
    if (sv < 0) { for (let k = s_cal + 1; k <= e_cal; k++) { if (calToVis[k] >= 0) { sv = calToVis[k]; break; } } }
    let ev = calToVis[e_cal];
    if (ev < 0) { for (let k = e_cal - 1; k >= s_cal; k--) { if (calToVis[k] >= 0) { ev = calToVis[k]; break; } } }
    if (sv === undefined || sv < 0 || ev === undefined || ev < 0 || ev < sv) return '';
    const span  = ev - sv + 1;
    const left  = (sv / units * 100).toFixed(3);
    const width = (span / units * 100).toFixed(3);
    const cls = 's-' + (p.enseigne || '').toUpperCase() +
      (p.statut === 'Terminé' ? ' done' : '') +
      (p.statut === 'Annulé'  ? ' cancel' : '');
    const title = (p.tache || '') +
      ' — ' + (SOC_LABELS[p.enseigne] || p.enseigne || '') +
      ' · ' + fmtDate(p.dateDebut) + ' → ' + fmtDate(p.dateFin) +
      (p.statut ? ' · ' + p.statut : '') +
      (p.note ? '\n' + p.note : '');
    return '<div class="gantt-bar ' + cls +
      '" style="left:' + left + '%;width:' + width + '%"' +
      ' data-act="edit-pl" data-id="' + esc(p.id) + '"' +
      ' title="' + esc(title) + '">' +
      '<div class="bar-hdl bar-hdl-l"></div>' +
      '<span class="bar-text">' + esc(p.tache || '—') + '</span>' +
      '<div class="bar-hdl bar-hdl-r"></div>' +
      '</div>';
  }

  let rowsHtml = '';
  const ENS_ORDER = ['ALL', 'CLO', 'JAR'];

  clientNames.forEach(function(name) {
    // Grouper par enseigne
    const byEns = {};
    byClient[name].forEach(function(p) {
      const e = (p.enseigne || '').toUpperCase();
      (byEns[e] = byEns[e] || []).push(p);
    });
    // Seulement les enseignes qui ont des interventions
    const activeEns = ENS_ORDER.filter(function(e) { return byEns[e] && byEns[e].length > 0; });

    let subRows = '';
    activeEns.forEach(function(ens) {
      let bars = weekendOverlay; // overlays weekend d'abord (z-index 0)
      byEns[ens].forEach(function(p) { bars += barHtml(p); });
      subRows += '<div class="gantt-subrow">' +
        '<div class="gantt-ens-tag s-' + ens + '">' + ens + '</div>' +
        '<div class="gantt-track" style="--cols:' + units + '">' + bars + '</div>' +
        '</div>';
    });

    rowsHtml += '<div class="gantt-row-group">' +
      '<div class="gantt-client-group" title="' + esc(name) + '">' + esc(name) + '</div>' +
      '<div class="gantt-subrows">' + subRows + '</div>' +
      '</div>';
  });

  const body = document.getElementById('ganttBody');
  body.innerHTML = rowsHtml || '<div class="empty">Aucune intervention planifiée. Cliquez sur « + Nouvelle intervention » pour démarrer.</div>';
}

// ─── Drag & resize des barres Gantt ─────────────────────────────────────────

let _ganttDrag = null;

/* Formate une Date en YYYY-MM-DD LOCAL (évite le décalage UTC) */
function localDateStr(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

/* Convertit un index de colonne visible en date locale yyyy-mm-dd */
function _ganttDateStr(u) {
  const calIdx = (STATE.ganttVisCal && STATE.ganttVisCal[u] !== undefined)
    ? STATE.ganttVisCal[u] : u;
  const d = new Date(STATE.planningStart);
  d.setDate(d.getDate() + calIdx);
  return localDateStr(d); // local, pas UTC
}

/* mousedown sur le ganttBody */
document.querySelector('.gantt-wrap').addEventListener('mousedown', function(e) {
  const bar = e.target.closest('.gantt-bar');
  if (!bar || !STATE.planningStart) return;

  const id = bar.dataset.id;
  const p  = (STATE.planning || []).find(function(x) { return x.id === id; });
  if (!p) return;

  // Type de drag selon la cible
  let type = 'move';
  if (e.target.classList.contains('bar-hdl-l')) type = 'resize-l';
  else if (e.target.classList.contains('bar-hdl-r')) type = 'resize-r';

  const units = STATE.planningUnits;
  const track = bar.closest('.gantt-track');
  const tRect = track.getBoundingClientRect();

  // Positions courantes en index visibles
  const debDate = new Date(p.dateDebut); debDate.setHours(0, 0, 0, 0);
  const finDate = new Date(p.dateFin || p.dateDebut); finDate.setHours(0, 0, 0, 0);
  const debCalIdx = diffDays(STATE.planningStart, debDate);
  const finCalIdx = diffDays(STATE.planningStart, finDate);
  function _calToVis(ci) {
    if (!STATE.ganttCalToVis) return ci;
    const v = STATE.ganttCalToVis[ci];
    if (v !== undefined && v >= 0) return v;
    for (let k = ci + 1; k < STATE.ganttCalToVis.length; k++) { if (STATE.ganttCalToVis[k] >= 0) return STATE.ganttCalToVis[k]; }
    for (let k = ci - 1; k >= 0; k--) { if (STATE.ganttCalToVis[k] >= 0) return STATE.ganttCalToVis[k]; }
    return Math.max(0, ci);
  }
  const deb0 = _calToVis(debCalIdx);
  const fin0 = _calToVis(finCalIdx);

  _ganttDrag = {
    type, id,
    deb0, fin0,
    bar, track,
    trackLeft: tRect.left,
    trackWidth: tRect.width,
    units,
    startX: e.clientX,
    curDeb: deb0,
    curFin: fin0,
    didMove: false
  };

  bar.classList.add('dragging');
  e.preventDefault(); // empêche la sélection de texte
});

/* mousemove global → mise à jour visuelle en temps réel */
document.addEventListener('mousemove', function(e) {
  if (!_ganttDrag) return;
  const { type, deb0, fin0, bar, trackLeft, trackWidth, units, startX } = _ganttDrag;

  if (Math.abs(e.clientX - startX) > 3) _ganttDrag.didMove = true;
  if (!_ganttDrag.didMove) return;

  // Delta en unités depuis la position initiale (évite les sauts d'arrondi)
  const deltaU = Math.round((e.clientX - startX) / trackWidth * units);

  let newDeb, newFin;
  if (type === 'move') {
    newDeb = deb0 + deltaU;
    newFin = fin0 + deltaU;
  } else if (type === 'resize-l') {
    // Snap vers le jour ouvrable le plus proche (pas de WE/férié)
    const raw = Math.min(fin0, deb0 + deltaU);
    newDeb = nearestWorkday(raw, deltaU <= 0 ? 1 : -1);
    newFin = fin0;
  } else { // resize-r
    const raw = Math.max(deb0, fin0 + deltaU);
    newFin = nearestWorkday(raw, deltaU >= 0 ? -1 : 1);
    newDeb = deb0;
  }

  _ganttDrag.curDeb = newDeb; // positions VRAIES (peuvent sortir de la vue)
  _ganttDrag.curFin = newFin;

  // Feedback visuel : toujours clampé à 0…units-1 pour rester dans la vue
  const dispL = Math.max(0, Math.min(units - 1, newDeb));
  const dispR = Math.max(dispL, Math.min(units - 1, newFin));
  bar.style.left  = (dispL / units * 100).toFixed(3) + '%';
  bar.style.width = ((dispR - dispL + 1) / units * 100).toFixed(3) + '%';
});

/* mouseup global → sauvegarde ou ouverture modale */
document.addEventListener('mouseup', async function(e) {
  if (!_ganttDrag) return;
  const { bar, curDeb, curFin, deb0, fin0, id, didMove, type } = _ganttDrag;
  _ganttDrag = null;
  bar.classList.remove('dragging');

  if (!didMove) {
    // Simple clic : ouvre le modal seulement pour la barre (pas les poignées)
    if (type !== 'move') return; // clic sur poignée sans bouger → rien
    return; // le gestionnaire 'click' existant prend le relais
  }

  _wasDragged = true; // inhibe le 'click' qui suit mouseup

  if (curDeb === deb0 && curFin === fin0) return; // pas de changement réel

  // Sauvegarde
  const p = (STATE.planning || []).find(function(x) { return x.id === id; });
  if (!p) return;
  p.dateDebut = _ganttDateStr(curDeb);
  p.dateFin   = _ganttDateStr(curFin);
  try {
    await API.savePlanning(p);
    STATE.planning = await API.getPlanning();
    renderPlanning();
  } catch (err) {
    alert('Erreur sauvegarde : ' + err.message);
    renderPlanning(); // restaure
  }
});

// Société checkboxes (partagé chantier + prospect)
// ═══════════════════════════════════════════════════════════
function renderSocChecks(containerId, selected) {
  const html = ['ALL','CLO','JAR'].map(function(code) {
    const on = (selected || []).indexOf(code) > -1;
    return '<label class="' + (on ? 'sel-' + code : '') + '">' +
      '<input type="checkbox" value="' + code + '"' + (on ? ' checked' : '') + '>' +
      SOC_LABELS[code] + '</label>';
  }).join('');
  const el = document.getElementById(containerId);
  el.innerHTML = html;
  el.querySelectorAll('input[type=checkbox]').forEach(function(cb) {
    cb.addEventListener('change', function() {
      const label = cb.closest('label');
      if (cb.checked) label.classList.add('sel-' + cb.value);
      else label.classList.remove('sel-' + cb.value);
    });
  });
}
function collectSocChecks(containerId) {
  return Array.from(document.getElementById(containerId).querySelectorAll('input[type=checkbox]:checked')).map(function(cb){ return cb.value; });
}

var COMMERCIAUX = ['Maxime', 'Lauren', 'Pierre Babad', 'Pierre Bignon', 'Thomas'];
var SOC_COMMERCIAUX = {
  ALL: ['Pierre Bignon', 'Thomas'],
  CLO: ['Maxime', 'Lauren'],
  JAR: ['Pierre Babad']
};
var SOC_FR_LABELS = { ALL: 'Allée', CLO: 'Clôture', JAR: 'Jardin' };

/* Affiche un sélecteur de commercial (radio) pour chaque société cochée */
function updatePrCommerciauxBlock(commerciaux) {
  var checked = collectSocChecks('socChecksPr');
  var block = document.getElementById('prCommerciauxBlock');
  if (!block) return;
  if (checked.length === 0) {
    block.innerHTML = '<span style="color:var(--muted);font-size:.82rem">Sélectionnez d\'abord une société.</span>';
    return;
  }
  var html = '<div class="pr-comm-block">';
  checked.forEach(function(code) {
    var options = SOC_COMMERCIAUX[code] || COMMERCIAUX;
    var curVal = commerciaux && commerciaux[code] ? commerciaux[code] : '';
    // Si un seul choix possible → pré-cocher automatiquement
    if (!curVal && options.length === 1) curVal = options[0];
    html += '<div class="pr-comm-row">';
    html += '<span class="pr-montant-label l-' + code + '">' + (SOC_FR_LABELS[code] || code) + '</span>';
    options.forEach(function(name) {
      var sel = (name === curVal) ? ' sel' : '';
      html += '<label class="pr-comm-radio' + sel + '">' +
        '<input type="radio" name="prComm_' + code + '" value="' + esc(name) + '"' + (name === curVal ? ' checked' : '') + '> ' +
        esc(name) + '</label>';
    });
    html += '</div>';
  });
  html += '</div>';
  block.innerHTML = html;
  // Toggle classe .sel sur changement
  block.querySelectorAll('input[type=radio]').forEach(function(radio) {
    radio.addEventListener('change', function() {
      block.querySelectorAll('input[name="' + radio.name + '"]').forEach(function(r) {
        var lbl = r.closest('label');
        if (r.checked) lbl.classList.add('sel'); else lbl.classList.remove('sel');
      });
    });
  });
}

/* Lit le commercial sélectionné pour chaque société */
function collectPrCommerciaux() {
  var result = {};
  ['ALL', 'CLO', 'JAR'].forEach(function(code) {
    var el = document.querySelector('input[name="prComm_' + code + '"]:checked');
    if (el) result[code] = el.value;
  });
  return result;
}

// ═══════════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════════
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showToast(msg, ms) {
  var t = document.createElement('div');
  t.className = 'app-toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, (ms || 3000) - 300);
  setTimeout(function() { t.remove(); }, ms || 3000);
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtEuro(n) {
  const v = Number(n) || 0;
  return v.toLocaleString('fr-FR', { maximumFractionDigits: 0 }) + ' €';
}
function fmtDate(d) {
  if (!d) return '';
  try { return new Date(d).toLocaleDateString('fr-FR'); } catch(e) { return String(d); }
}
function dstr(d) {
  if (!d) return '';
  try { return new Date(d).toISOString().slice(0,10); } catch(e) { return ''; }
}

(function init() {
  try {
    const raw = localStorage.getItem('btb_user');
    if (raw) {
      STATE.user = JSON.parse(raw);
      bootApp();
    }
  } catch (e) {}
})();
